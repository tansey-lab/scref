[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scref"
version = "0.1.0"
description = "scRNAseq-referenced contamination, marker, and concordance analysis for spatial transcriptomics"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scanpy",
    "anndata",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scref*"]
